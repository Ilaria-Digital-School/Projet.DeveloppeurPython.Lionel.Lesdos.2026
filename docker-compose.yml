# Ancre commune : plafonne les journaux de chaque conteneur.
# Sans elle, le pilote json-file de Docker ecrit sans aucune limite.
x-logging: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *journaux
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Loopback uniquement : accessible depuis l'hôte (tests pytest),
      # jamais depuis l'extérieur. DB_PORT si 5432 est déjà pris.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 range ses données dans un sous-dossier par version
      # majeure de /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - budget_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis (sessions, cache, rate limiting)
  # ============================================
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *journaux
    networks:
      - budget_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Flask / Gunicorn Application
  # ============================================
  app:
    container_name: budget-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *journaux
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Sonde /healthz (app + base). Docker marque le conteneur "unhealthy" sans
    # le redémarrer : visible dans `docker compose ps` et pour la supervision.
    # Application : http://localhost:5000 (APP_PORT si 5000 est déjà pris).
    # Loopback uniquement ; en production, un reverse proxy est placé devant.
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - app_uploads:/app/backend/instance/uploads
      - app_logs:/app/backend/logs
      # Fichiers statiques de l'hôte : modifiables sans reconstruire l'image
      - ./frontend/static:/app/frontend/static
    networks:
      - budget_network

  # ============================================
  # Scheduler (transactions récurrentes)
  # ============================================
  scheduler:
    container_name: budget-scheduler
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *journaux
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["./docker/scripts/scheduler.sh"]
    # Battement de cœur écrit après chaque passage réussi (scheduler.sh) :
    # "unhealthy" si aucun passage n'a réussi depuis plus de 25 h
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/scheduler_heartbeat && test $$(( $$(date +%s) - $$(cat /tmp/scheduler_heartbeat) )) -lt 90000"]
      interval: 5m
      timeout: 10s
      start_period: 15m
      retries: 2
    networks:
      - budget_network

volumes:
  postgres_data:
  app_uploads:
  app_logs:

networks:
  budget_network:
    driver: bridge
