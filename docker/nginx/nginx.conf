server {
    listen 80;
    server_name _;

    # === Headers de securite ===
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP geree par Flask (nonces dynamiques par requete)

    # === Limites de securite ===
    client_max_body_size 16M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # === Masquer la version Nginx ===
    server_tokens off;

    # === Reverse proxy vers Gunicorn ===
    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://app:5000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Server;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # === Fichiers statiques (servis directement par Nginx) ===
    location /static/ {
        alias /app/frontend/static/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # === Bloquer l'acces aux fichiers sensibles ===
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|ini|log|sql|bak|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
